<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zine Viewer</title>
  <link rel="stylesheet" href="./src/index.css" />
  <script type="module" src="/src/zine-viewer.ts"></script>
</head>

<body>
  <main style="padding: 16px; max-width: 1200px; margin: 0 auto;">
    <h2>Letter sheet split into 8 pages</h2>
    <div style="height: 640px; outline: 1px solid #555; padding: 8px; margin-bottom: 24px;">
      <zine-viewer sheet="/tea-friends.jpg"></zine-viewer>
    </div>

    <h2>Size preset examples</h2>
    <div
      style="display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 16px; width: 100%; margin-bottom: 24px; flex-shrink: 0;">
      <div>
        <h3 style="margin: 0 0 8px;">default (`letter-8up`)</h3>
        <div style="height: 260px; outline: 1px solid #555; padding: 8px;">
          <zine-viewer id="zine-default"></zine-viewer>
        </div>
      </div>
      <div>
        <h3 style="margin: 0 0 8px;">`letter-half`</h3>
        <div style="height: 260px; outline: 1px solid #555; padding: 8px;">
          <zine-viewer id="zine-letter-half" size="letter-half"></zine-viewer>
        </div>
      </div>
      <div>
        <h3 style="margin: 0 0 8px;">`a5`</h3>
        <div style="height: 260px; outline: 1px solid #555; padding: 8px;">
          <zine-viewer id="zine-a5" size="a5"></zine-viewer>
        </div>
      </div>
      <div>
        <h3 style="margin: 0 0 8px;">`a6`</h3>
        <div style="height: 260px; outline: 1px solid #555; padding: 8px;">
          <zine-viewer id="zine-a6" size="a6"></zine-viewer>
        </div>
      </div>
      <div>
        <h3 style="margin: 0 0 8px;">`square`</h3>
        <div style="height: 260px; outline: 1px solid #555; padding: 8px;">
          <zine-viewer id="zine-square" size="square"></zine-viewer>
        </div>
      </div>
      <div>
        <h3 style="margin: 0 0 8px;">`digest-6x9`</h3>
        <div style="height: 260px; outline: 1px solid #555; padding: 8px;">
          <zine-viewer id="zine-digest" size="digest-6x9"></zine-viewer>
        </div>
      </div>
    </div>

    <h2>Keyboard Navigation Focus Only</h2>
    <div
      style="width: 320px; height: 280px; min-height: 280px; flex-shrink: 0; outline: 1px solid #555; padding: 8px; margin-bottom: 16px;">
      <zine-viewer id="zine-focus-only" keyboard-navigation-focus-only size="a5"></zine-viewer>
    </div>

    <h2>Autoplay</h2>
    <div style="width: 320px; height: 280px; min-height: 280px; flex-shrink: 0; outline: 1px solid #555; padding: 8px;">
      <zine-viewer id="zine-autoplay" autoplay autoplay-interval="3000" size="a6"></zine-viewer>
    </div>
  </main>
  <script type="module">
    import {
      lookupZinePresetDimensions,
      ZINE_PAGE_DIMENSION_DEFAULT,
    } from "./src/zine-sizes.ts";

    // local dev placeholders: data-URL SVGs avoid cross-origin / CORP blocks from third-party hosts
    function escapeXml ( s ) {
      return String( s )
        .replace( /&/g, "&amp;" )
        .replace( /</g, "&lt;" )
        .replace( />/g, "&gt;" )
        .replace( /"/g, "&quot;" );
    }

    // scale so the long edge is ~900px; keeps labels readable on small presets like a6
    function ph ( label, pageWidth, pageHeight, bg = "#e8e8e8", fg = "#333333" ) {
      const longEdge = Math.max( pageWidth, pageHeight );
      const scale = 900 / longEdge;
      const width = Math.round( pageWidth * scale );
      const height = Math.round( pageHeight * scale );
      const safe = escapeXml( label );
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
        `<rect fill="${bg}" width="100%" height="100%"/>` +
        `<text x="50%" y="50%" font-family="system-ui,sans-serif" font-size="40" fill="${fg}" ` +
        `text-anchor="middle" dominant-baseline="middle">${safe}</text></svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent( svg )}`;
    }

    function pagesForPreset ( presetId ) {
      const dims =
        lookupZinePresetDimensions( presetId ) ?? ZINE_PAGE_DIMENSION_DEFAULT;
      const { pageWidth: w, pageHeight: h } = dims;
      return [
        {
          img: ph( "cover", w, h, "#fdf6e3", "#586e75" ),
          backImg: ph( "1", w, h, "#eee8d5", "#586e75" ),
        },
        {
          img: ph( "2", w, h, "#e0f0ff", "#268bd2" ),
          backImg: ph( "3", w, h, "#ffe8e0", "#cb4b16" ),
        },
        {
          img: ph( "4", w, h, "#e8ffe8", "#859900" ),
          backImg: ph( "5", w, h, "#f0e8ff", "#6c71c4" ),
        },
        {
          img: ph( "6", w, h, "#fff0e8", "#d33682" ),
          backImg: ph( "back", w, h, "#eee", "#657b83" ),
        },
      ];
    }

    const viewers = [
      { id: "zine-default", size: "" },
      { id: "zine-letter-half", size: "letter-half" },
      { id: "zine-a5", size: "a5" },
      { id: "zine-a6", size: "a6" },
      { id: "zine-square", size: "square" },
      { id: "zine-digest", size: "digest-6x9" },
      { id: "zine-focus-only", size: "a5" },
      { id: "zine-autoplay", size: "a6" },
    ];

    for ( const { id, size } of viewers ) {
      document
        .getElementById( id )
        .setAttribute( "pages", JSON.stringify( pagesForPreset( size ) ) );
    }
  </script>

</body>

</html>
